name: Xoshi XI Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

jobs:
  xoshi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: x-agent/package-lock.json

      - name: Install dependencies
        working-directory: x-agent
        run: npm install

      - name: Install Playwright
        working-directory: x-agent
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        working-directory: x-agent
        run: npx tsc --noEmit

      - name: Run Xoshi XI
        working-directory: x-agent
        env:
          FASTAPI_URL: ${{ secrets.FASTAPI_URL }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          XOSHI_HANDLE: xoshi_Si
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: npx ts-node run_cycle.ts
